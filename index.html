<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1F3B">
  <title>League Pass Gremlins</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="leagueName">League Pass Gremlins</h1>
      <p id="seasonLine"></p>
    </div>
    <button id="refreshBtn" type="button">Refresh</button>
  </header>

  <main>
    <section class="race" id="race" aria-live="polite"></section>
    <p id="banner" class="banner" role="status"></p>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="games">Games</button>
      <button type="button" role="tab" data-tab="season">Season</button>
      <button type="button" role="tab" data-tab="weeks">Weekly results</button>
      <button type="button" role="tab" data-tab="teams">Teams</button>
    </nav>

    <section id="panel" class="panel"></section>
  </main>

  <footer class="foot">
    Scores from ESPN, refreshed every minute while games are live. Last updated <span id="updated">never</span>.
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

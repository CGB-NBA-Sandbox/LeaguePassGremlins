<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1F3B">
  <title>League Pass Gremlins</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gremlins">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=27">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="leagueName">League Pass Gremlins</h1>
      <p id="seasonLine"></p>
      <p class="seasons"><a href="2025-26/">View 2025-26 season &rarr;</a></p>
    </div>
    <button id="refreshBtn" type="button">Refresh</button>
  </header>

  <main>
    <section class="race" id="race" aria-live="polite"></section>
    <p id="banner" class="banner" role="status"></p>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="games">Games</button>
      <button type="button" role="tab" data-tab="season">Season</button>
      <button type="button" role="tab" data-tab="weeks">Weeks</button>
      <button type="button" role="tab" data-tab="teams">Teams</button>
      <button type="button" role="tab" data-tab="ou">O/U</button>
      <button type="button" role="tab" data-tab="proj">Proj</button>
      <button type="button" role="tab" data-tab="bets">Bets</button>
      <button type="button" role="tab" data-tab="cup">Cup</button>
      <!-- chat hidden for now: <button type="button" role="tab" data-tab="chat">Chat</button> -->
    </nav>

    <section id="panel" class="panel"></section>
    <section id="chat" class="chat" hidden></section>
  </main>

  <footer class="foot">
    Scores from ESPN, refreshed every 30 seconds while games are live. Last updated <span id="updated">never</span>.
  </footer>

  <nav class="bottombar" aria-label="Main">
    <button type="button" data-tab="games"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 10.8 0 12.8M18.4 5.6c-3 3-3 10.8 0 12.8"/></svg><span>Games</span></button>
    <button type="button" data-tab="season"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle class="fill" cx="4.5" cy="6" r="1.4"/><circle class="fill" cx="4.5" cy="12" r="1.4"/><circle class="fill" cx="4.5" cy="18" r="1.4"/></svg><span>Season</span></button>
    <button type="button" data-tab="proj"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Proj</span></button>
    <!-- chat hidden for now: <button type="button" data-tab="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/></svg><span>Chat</span></button> -->
    <button type="button" data-tab="bets"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v2h6V4M9 14l2 2 4-4"/></svg><span>Bets</span></button>
    <button type="button" id="moreBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="5" cy="12" r="1.7"/><circle class="fill" cx="12" cy="12" r="1.7"/><circle class="fill" cx="19" cy="12" r="1.7"/></svg><span>More</span></button>
  </nav>
  <div class="sheet" id="moreSheet" hidden>
    <div class="sheet-back"></div>
    <div class="sheet-panel" role="menu">
      <button type="button" role="menuitem" data-tab="weeks">Weeks</button>
      <button type="button" role="menuitem" data-tab="teams">Teams</button>
      <button type="button" role="menuitem" data-tab="ou">O/U</button>
      <button type="button" role="menuitem" data-tab="cup">Cup</button>
    </div>
  </div>

  <script src="config.js?v=27"></script>
  <script src="app.js?v=27"></script>
  <script src="boxscore.js?v=27"></script>
  <script src="bets.js?v=27"></script>
  <script type="module" src="chat.js?v=27"></script>
</body>
</html>
